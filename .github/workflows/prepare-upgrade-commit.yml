name: Prepare checksum-verified upgrade commit

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'enhance/insurance-map-setup-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the reviewed patch and resulting tree
        env:
          BASE_COMMIT: f753d827f5e85aea4e61be7e6fa9145a28d1ecd3
          EXPECTED_TREE: d9dbbb74ffbc723b46736c23ac8e406280060fb9
        run: |
          python3 - <<'PY'
          import gzip, hashlib, os
          from pathlib import Path
          packed = b''.join(Path(f'.github/upgrade-transport/{i}.part').read_bytes() for i in range(4))
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '59833cf1e625a22784b6598161c9cb91b9a4864ade058d79b6e360522fbd1715'
          Path(os.environ['RUNNER_TEMP'], 'reviewed-upgrade.patch').write_bytes(patch)
          PY
          git read-tree --reset -u "$BASE_COMMIT"
          git apply --index --unidiff-zero "$RUNNER_TEMP/reviewed-upgrade.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Create Git objects only; never move a branch or deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_COMMIT: f753d827f5e85aea4e61be7e6fa9145a28d1ecd3
          BASE_TREE: af7bc371983667a5b07328a3dbbc2636f240dad2
          EXPECTED_TREE: d9dbbb74ffbc723b46736c23ac8e406280060fb9
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const repo = process.env.REPO;
          assert.equal(repo, 'CatCorner22/precog');
          const post = async (path, body) => {
            assert.ok(['blobs', 'trees', 'commits'].includes(path));
            const response = await fetch(`https://api.github.com/repos/${repo}/git/${path}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify(body),
            });
            if (!response.ok) throw new Error(`Git ${path}: HTTP ${response.status}`);
            return response.json();
          };
          const files = git('diff', '--cached', '--name-only', process.env.BASE_COMMIT).split('\n');
          assert.equal(files.length, 37);
          const tree = [];
          for (const path of files) {
            assert.ok(path.startsWith('src/') || path.startsWith('scripts/') || path === 'migrations/0022_atomic_llm_budget.sql' || path === '.github/workflows/ci.yml');
            const content = execFileSync('git', ['show', `:${path}`]);
            const blob = await post('blobs', { content: content.toString('base64'), encoding: 'base64' });
            const expected = git('rev-parse', `:${path}`);
            assert.equal(blob.sha, expected);
            const mode = git('ls-files', '--stage', '--', path).split(' ')[0];
            tree.push({ path, mode, type: 'blob', sha: blob.sha });
          }
          const createdTree = await post('trees', { base_tree: process.env.BASE_TREE, tree });
          assert.equal(createdTree.sha, process.env.EXPECTED_TREE);
          const commit = await post('commits', {
            message: 'feat: confirmed insurance modeling, map history, setup review and fair AI budgets',
            tree: createdTree.sha,
            parents: [process.env.HEAD_SHA],
          });
          const result = { sha: commit.sha, tree: createdTree.sha, parent: process.env.HEAD_SHA, files: files.length, branchUpdated: false, deployed: false };
          writeFileSync(join(process.env.RUNNER_TEMP, 'prepared-commit.json'), JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: checksum-verified-upgrade-commit
          path: ${{ runner.temp }}/prepared-commit.json
          retention-days: 1
