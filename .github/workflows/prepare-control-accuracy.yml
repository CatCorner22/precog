name: Prepare verified control-accuracy blobs

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: >-
      github.repository == 'CatCorner22/precog' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/control-guidance-accuracy-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Verify reviewed patch and exact resulting tree
        env:
          BASE_COMMIT: 5a4175922a2f1c29aedb892cd46069879fe79e89
          EXPECTED_TREE: b85abdbbd88ed7652a4ff3d743c7ec2d83ee26d9
        run: |
          python3 - <<'PY'
          import gzip, hashlib, os
          from pathlib import Path
          packed = b''.join(Path(f'.github/control-transport/{i}.part').read_bytes() for i in range(13))
          assert hashlib.sha256(packed).hexdigest() == '89e598b5e376d2f6f9172376d4a65c93c47a64470d8b485faf47cbc4ae2fe06f'
          patch = gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == '8b362b75aac4c46125eae9e55913a697e29dc2a6a9427176551c0e7dfe02d288'
          Path(os.environ['RUNNER_TEMP'], 'control-accuracy.patch').write_bytes(patch)
          PY
          git read-tree --reset -u "$BASE_COMMIT"
          git apply --index --unidiff-zero "$RUNNER_TEMP/control-accuracy.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Upload only verified Git blobs; never move refs or deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: 5a4175922a2f1c29aedb892cd46069879fe79e89
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(git('write-tree'), 'b85abdbbd88ed7652a4ff3d743c7ec2d83ee26d9');
          const rows = git('diff', '--cached', '--name-status', process.env.BASE_COMMIT).split('\n');
          assert.equal(rows.length, 37);
          let count = 0;
          for (const row of rows) {
            const [status, path] = row.split('\t');
            if (status === 'D') {
              assert.equal(path, '.github/workflows/control-review-workspace.yml');
              continue;
            }
            assert.ok(path.startsWith('src/') || path === 'README.md' || path === 'docs/CONTROL_ACCURACY_2026-09-29.md');
            const content = execFileSync('git', ['show', `:${path}`]);
            const response = await fetch('https://api.github.com/repos/CatCorner22/precog/git/blobs', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'Content-Type': 'application/json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: JSON.stringify({ content: content.toString('base64'), encoding: 'base64' }),
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`Git blob upload: HTTP ${response.status}`);
            const blob = await response.json();
            assert.equal(blob.sha, git('rev-parse', `:${path}`));
            console.log(JSON.stringify({ path, sha: blob.sha }));
            count += 1;
          }
          assert.equal(count, 36);
          console.log(JSON.stringify({ verifiedBlobs: count, tree: git('write-tree'), branchUpdated: false, deployed: false }));
          JS
