name: Prepare reviewed account-safety blobs
on:
  pull_request:
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'CatCorner22/precog' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/account-data-safety-20260925'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact approved source tree
        env:
          BASE_COMMIT: 9941e338e1acb382c82e478ef8dc700b98b7c402
          EXPECTED_TREE: e2f7d26f345811c7fbbfd6b384f6e5f7e7040477
        run: |
          python3 - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          data = b''.join(Path(f'.github/safety-transfer/{i}.part').read_bytes() for i in range(14))
          patch = lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '6d8dbdd4cd98ceebd8ca44cc68529635c8c7e968709830f9e4f559c1b7a9b597'
          Path(os.environ['RUNNER_TEMP'], 'safety.patch').write_bytes(patch)
          PY
          git read-tree --reset -u "$BASE_COMMIT"
          git apply --index --unidiff-zero "$RUNNER_TEMP/safety.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Upload verified blobs only; never move branches or deploy
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_COMMIT: 9941e338e1acb382c82e478ef8dc700b98b7c402
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const paths = git('diff', '--cached', '--name-only', process.env.BASE_COMMIT).split('\n');
          assert.equal(paths.length, 38);
          for (const path of paths) {
            assert.ok(path.startsWith('src/') || path.startsWith('scripts/') || path === 'docs/ACCOUNT_DATA_SAFETY.md' || path === 'migrations/0023_business_deletion_markers.sql' || path === '.github/workflows/ci.yml');
            const content = execFileSync('git', ['show', `:${path}`]);
            const response = await fetch('https://api.github.com/repos/CatCorner22/precog/git/blobs', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content: content.toString('base64'), encoding: 'base64' }),
            });
            if (!response.ok) throw new Error(`Blob upload failed: HTTP ${response.status}`);
            const result = await response.json();
            assert.equal(result.sha, git('rev-parse', `:${path}`));
            console.log(JSON.stringify({ path, sha: result.sha }));
          }
          console.log(JSON.stringify({ ok: true, blobs: paths.length, branchesChanged: false, deployed: false }));
          JS
