name: Control accuracy validation workspace

on:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/control-guidance-accuracy-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package source and dependencies only
        run: |
          mkdir -p "$RUNNER_TEMP/control-review"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/control-review"
          cp -a node_modules "$RUNNER_TEMP/control-review/"
          git rev-parse HEAD > "$RUNNER_TEMP/control-review/REVIEW_COMMIT.txt"
          tar -C "$RUNNER_TEMP/control-review" -czf "$RUNNER_TEMP/control-review.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: control-review-workspace
          path: ${{ runner.temp }}/control-review.tar.gz
          retention-days: 1
          compression-level: 0
