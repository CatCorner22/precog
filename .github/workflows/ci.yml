name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build, verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - if: ${{ !cancelled() }}
        run: npm run lint
      - if: ${{ !cancelled() }}
        run: npm run format:check
      - if: ${{ !cancelled() }}
        run: npm run audit:prod
      - if: ${{ !cancelled() }}
        run: npm test
      - if: ${{ !cancelled() }}
        id: build
        run: npm run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:bundle
      - if: ${{ !cancelled() }}
        run: npm run verify:evidence
      - if: ${{ !cancelled() }}
        run: npm run verify:template
      - name: Show formatting corrections without committing them
        if: ${{ failure() && !cancelled() }}
        run: |
          npm run format > /dev/null
          git diff --no-ext-diff -- src scripts .github package.json

  migrations:
    name: Migrations against real Postgres, applied twice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: precog
          POSTGRES_PASSWORD: precog
          POSTGRES_DB: precog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://precog:precog@localhost:5432/precog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to an empty database
        run: node scripts/migrate.mjs
      - name: Reapply; the ledger must skip every file
        run: node scripts/migrate.mjs | tee second-run.log && grep -q "up to date" second-run.log
      - name: Required schema exists
        run: |
          node -e '
            const pg = require("pg");
            const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
            const need = ["user","session","business_profiles","businesses","assessment_snapshots","map_shares","map_share_attempts","llm_daily_usage","firms","engagement_marks","review_events","business_tombstones","llm_daily_rejections","_migrations"];
            pool.query("select table_name from information_schema.tables where table_schema = $1", ["public"]).then(({ rows }) => {
              const have = new Set(rows.map((r) => r.table_name));
              const missing = need.filter((t) => !have.has(t));
              if (missing.length) { console.error("missing tables:", missing); process.exitCode = 1; }
              return pool.end();
            }).catch((error) => { console.error(error); process.exitCode = 1; return pool.end(); });
          '

  e2e:
    name: Builder end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sSf http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 2
          done
          cat dev.log; exit 1
      - run: node scripts/e2e-warmup.mjs http://127.0.0.1:8080/
      - run: npm run e2e -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-failure.png
      - name: Every industry and tab plus standalone routes
        run: npm run e2e:tabs -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-tabs-failure.png
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e-failure.png
            e2e-tabs-failure.png
            dev.log
          if-no-files-found: ignore

  release-gate:
    name: Required release gate
    if: ${{ always() }}
    needs: [checks, migrations, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Mandatory jobs must succeed, not merely skip
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); const bad = Object.entries(jobs).filter(([,j]) => j.result !== "success"); if (bad.length) { console.error(bad); process.exit(1); }'
