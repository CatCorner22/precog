name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its older run. Every push to main
# keeps its own group (keyed on the commit), so each merge gets a finished
# release gate instead of being cancelled by the next merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commits; .github/dependabot.yml keeps them current.
jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: install
        run: npm ci

      # Each check runs even when an earlier one fails, so one run reports
      # every problem (a formatting slip no longer hides the test results).
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:prod
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:bundle
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:headers
      - name: Signed control evidence lifecycle on compiled HTTP handlers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:evidence:http
        env:
          DATABASE_URL: ""
          PRECOG_CONTROL_E2E: "1"

  migrations:
    name: Migrations against real Postgres, applied twice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: precog
          POSTGRES_PASSWORD: precog
          POSTGRES_DB: precog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://precog:precog@localhost:5432/precog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply every migration to an empty database
        run: npm run db:migrate

      - name: Apply again; the ledger must skip every file
        run: npm run db:migrate | tee second-run.log && grep -q "up to date" second-run.log

      - name: Concurrent migration admission, timeout and rollback
        run: npm run test:postgres:migrations
        env:
          PRECOG_MIGRATION_TEST: "1"

      - name: Atomic model budget with concurrent PostgreSQL connections
        run: npm run test:postgres:quota
        env:
          PRECOG_QUOTA_TEST: "1"

      - name: Business lifecycle on concurrent real PostgreSQL connections
        run: npm run test:postgres:lifecycle
        env:
          PRECOG_LIFECYCLE_POSTGRES: "1"

      - name: Control evidence on concurrent real PostgreSQL connections
        run: npm run test:postgres:evidence
        env:
          PRECOG_LIFECYCLE_POSTGRES: "1"

  e2e:
    name: Builder end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - uses: ./.github/actions/setup-playwright

      - name: Start dev server
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sSf http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 2
          done
          echo "dev server did not start"; cat dev.log; exit 1

      - name: Warm the dev server so dependency discovery finishes before the tests
        run: npm run e2e:warmup -- http://127.0.0.1:8080/

      - name: Map builder
        run: npm run e2e -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-failure.png

      - name: Insurance, map history, and setup recovery
        run: npm run e2e:enhancements -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-enhancements-failure.png

      - name: Every tab, every industry, plus the standalone pages
        run: npm run e2e:tabs -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-tabs-failure.png

      - name: Write, verify and link a procedure
        run: npm run e2e:procedures -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-procedures-failure.png

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure
          path: |
            e2e-failure.png
            e2e-tabs-failure.png
            e2e-enhancements-failure.png
            e2e-procedures-failure.png
            dev.log
          if-no-files-found: ignore

  account-safety:
    name: Authenticated compiled-server safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: precog
          POSTGRES_PASSWORD: precog
          POSTGRES_DB: precog_safety_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precog -d precog_safety_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://precog:precog@localhost:5432/precog_safety_e2e
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: isolated-ci-fixture-secret-not-for-production-2026
      PRECOG_AUTH_TEST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - uses: ./.github/actions/setup-playwright
      - name: Serve the compiled Vercel handler, never the dev server
        run: |
          node scripts/serve-built-test.mjs > compiled-test.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sSf http://localhost:8080/api/auth/get-session > /dev/null && exit 0
            sleep 2
          done
          cat compiled-test.log
          exit 1
      - name: Signed sessions and account boundaries
        run: npm run e2e:safety
      - name: Control evidence workflow in the browser (isolated embedded database)
        run: npm run e2e:evidence
        env:
          DATABASE_URL: ""
          PRECOG_CONTROL_E2E: "1"
          PRECOG_E2E_OUTPUT: artifacts/control-evidence
      - name: Every tab, every industry, on the compiled handler (signed out)
        run: npm run e2e:tabs -- http://localhost:8080/
        env:
          E2E_SCREENSHOT: artifacts/compiled-tabs-failure.png
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-safety-failure
          path: |
            artifacts/account-safety-failure.png
            artifacts/compiled-tabs-failure.png
            artifacts/control-evidence/
            compiled-test.log
          retention-days: 3
          if-no-files-found: ignore

  release-gate:
    name: Release gate
    if: always()
    needs: [checks, migrations, e2e, account-safety]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory jobs to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          E2E: ${{ needs.e2e.result }}
          ACCOUNT_SAFETY: ${{ needs.account-safety.result }}
        run: |
          test "$CHECKS" = success
          test "$MIGRATIONS" = success
          test "$E2E" = success
          test "$ACCOUNT_SAFETY" = success
