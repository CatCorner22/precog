name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run audit:prod
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  migrations:
    name: Migrations against real Postgres, applied twice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: precog
          POSTGRES_PASSWORD: precog
          POSTGRES_DB: precog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://precog:precog@localhost:5432/precog
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply every migration to an empty database
        run: node scripts/migrate.mjs

      - name: Apply again; the ledger must skip every file
        run: node scripts/migrate.mjs | tee second-run.log && grep -q "up to date" second-run.log

      - name: Atomic model budget with concurrent PostgreSQL connections
        run: node --experimental-strip-types scripts/test-quota-postgres.mjs
        env:
          PRECOG_QUOTA_TEST: "1"

      - name: Business lifecycle on concurrent real PostgreSQL connections
        run: npx vitest run src/lib/precog/business-lifecycle-safety.test.ts
        env:
          PRECOG_LIFECYCLE_POSTGRES: "1"

      - name: Every table the migrations create exists
        run: |
          node -e '
            const fs = require("fs");
            const pg = require("pg");
            const need = new Set();
            for (const file of fs.readdirSync("migrations").filter((f) => f.endsWith(".sql"))) {
              for (const m of fs.readFileSync(`migrations/${file}`, "utf8").matchAll(/create table if not exists "?(\w+)"?/gi)) need.add(m[1]);
            }
            need.add("_migrations");
            const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
            pool.query("select table_name from information_schema.tables where table_schema = $1", ["public"]).then(({ rows }) => {
              const have = new Set(rows.map((r) => r.table_name));
              const missing = [...need].filter((t) => !have.has(t));
              if (missing.length) { console.error("missing tables:", missing); process.exit(1); }
              console.log(`all ${need.size} expected tables present`);
              return pool.end();
            });
          '

  e2e:
    name: Builder end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sSf http://127.0.0.1:8080/ > /dev/null && exit 0
            sleep 2
          done
          echo "dev server did not start"; cat dev.log; exit 1

      - name: Warm the dev server so dependency discovery finishes before the tests
        run: node scripts/e2e-warmup.mjs http://127.0.0.1:8080/

      - run: npm run e2e -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-failure.png

      - name: Insurance, map history, and setup recovery
        run: node scripts/e2e-enhancements.mjs http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-enhancements-failure.png

      - name: Every tab, every industry, plus /threat, /report, /login, /share
        run: npm run e2e:tabs -- http://127.0.0.1:8080/
        env:
          E2E_SCREENSHOT: e2e-tabs-failure.png

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e-failure.png
            e2e-tabs-failure.png
            e2e-enhancements-failure.png
            dev.log
          if-no-files-found: ignore

  account-safety:
    name: Authenticated compiled-server safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: precog
          POSTGRES_PASSWORD: precog
          POSTGRES_DB: precog_safety_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precog -d precog_safety_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://precog:precog@localhost:5432/precog_safety_e2e
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: isolated-ci-fixture-secret-not-for-production-2026
      PRECOG_AUTH_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve the compiled Vercel handler, never the dev server
        run: |
          node scripts/serve-built-test.mjs > compiled-test.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sSf http://localhost:8080/api/auth/get-session > /dev/null && exit 0
            sleep 2
          done
          cat compiled-test.log
          exit 1
      - run: node scripts/e2e-account-safety.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-safety-failure
          path: |
            artifacts/account-safety-failure.png
            compiled-test.log
          retention-days: 3
          if-no-files-found: ignore

  release-gate:
    name: Release gate
    if: always()
    needs: [checks, migrations, e2e, account-safety]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory jobs to succeed
        env:
          CHECKS: ${{ needs.checks.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          E2E: ${{ needs.e2e.result }}
          ACCOUNT_SAFETY: ${{ needs.account-safety.result }}
        run: |
          test "$CHECKS" = success
          test "$MIGRATIONS" = success
          test "$E2E" = success
          test "$ACCOUNT_SAFETY" = success
