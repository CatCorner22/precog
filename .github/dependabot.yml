# Keeps the commit-pinned GitHub Actions in .github/ and the npm packages
# current, with one grouped pull request a week for each. Dependabot never
# proposes a major npm version, which needs deliberate work; nitro (a pinned
# beta) and nf3 (an override) move only by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: nitro
      - dependency-name: nf3
      # Better Auth 1.7 changed the OAuth plugin the Grok sign-in relies on;
      # minor versions move only with a deliberate sign-in upgrade.
      - dependency-name: better-auth
        update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
